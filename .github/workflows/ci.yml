name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref cancels the unfinished run. On the default branch this is safe only because
# ci-scope.mjs selects every scope for a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id must stay `changes`: ci-gate.mjs reads the scopes from it.
  changes:
    name: Changed scopes
    runs-on: ubuntu-latest
    outputs:
      # one line per scope of .github/ci/routing.json
      home: ${{ steps.scope.outputs.home }}
      agentshed: ${{ steps.scope.outputs.agentshed }}
      justsnap: ${{ steps.scope.outputs.justsnap }}
      site_kit: ${{ steps.scope.outputs.site_kit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # a pull request is compared from its merge base
          persist-credentials: false
      - id: scope
        run: node .github/ci/ci-scope.mjs

  # Always runs, so no scope lists it and the gate always requires it.
  repo-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
      - run: node --test .github/ci/*.test.mjs

  # The homepage, apps/home: listed under the `home` scope in routing.json. The commands name the package: a
  # pnpm --filter that matches nothing succeeds, which workflows.test.mjs guards against. Deployment is the
  # Deploy workflow, which runs after this workflow succeeds on a push to main.
  home-checks:
    name: Homepage checks
    needs: changes
    if: needs.changes.outputs.home == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must come before setup-node: setup-node's cache: 'pnpm' calls pnpm to find the store path
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aloong-planet/home run typecheck
      - run: pnpm --filter @aloong-planet/home run test
      - run: pnpm --filter @aloong-planet/home run build

  # Agentshed's site, apps/agentshed: listed under the `agentshed` scope in routing.json. The type check, the lint,
  # the lint rule's own test and the tests (unit, the built site, the browser cases) are the package's own scripts.
  # The tests build the site themselves, into a fresh directory, so no build step precedes them. The browser cases run
  # the headless Chromium of the package's Playwright, with the system libraries and fonts it needs on this runner.
  # Nothing is cached yet. Playwright's CI guide advises against caching its browsers (restoring a cache takes about as
  # long as the download, and the system libraries cannot be cached); read this install step's time in a run before
  # adding one, as the width-check job's comment says.
  agentshed-checks:
    name: Agentshed site checks
    needs: changes
    if: needs.changes.outputs.agentshed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must come before setup-node: setup-node's cache: 'pnpm' calls pnpm to find the store path
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aloong-planet/agentshed exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @aloong-planet/agentshed run check
      - run: pnpm --filter @aloong-planet/agentshed run lint
      - run: pnpm --filter @aloong-planet/agentshed run test:lint-rule
      - run: pnpm --filter @aloong-planet/agentshed run test

  # JustSnap's site, apps/justsnap: listed under the `justsnap` scope in routing.json. The type check and the tests (unit,
  # and the built site read as files) are the package's own scripts. The tests build the site themselves, into a fresh
  # directory, so no build step precedes them. They run no browser, so none is installed: the page's width is the width
  # check's.
  justsnap-checks:
    name: JustSnap site checks
    needs: changes
    if: needs.changes.outputs.justsnap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must come before setup-node: setup-node's cache: 'pnpm' calls pnpm to find the store path
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aloong-planet/justsnap run check
      - run: pnpm --filter @aloong-planet/justsnap run test

  # What the two sites share, packages/site-kit: listed under the `site_kit` scope in routing.json, which only a change
  # that selects every scope selects (a change under packages/, to the lockfile or another shared input, under .github/,
  # or to a path no rule lists), so both sites' checks and the width check run beside this job. The type check, which
  # also covers the component, and the package's own tests are its scripts. No browser is installed: the tests render
  # the component and read stylesheets as files.
  site-kit-checks:
    name: Site kit checks
    needs: changes
    if: needs.changes.outputs.site_kit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must come before setup-node: setup-node's cache: 'pnpm' calls pnpm to find the store path
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aloong-planet/site-kit run check
      - run: pnpm --filter @aloong-planet/site-kit run test

  # The width check of every site: opens each page of each site's build in a browser at every window width from
  # 320px to 1440px and fails when a page is wider than the window (app-sites::QR-001/AC-01). The check builds every
  # site under apps/ itself, so a site added later is covered without a change here. Listed under the scope of every
  # site, because the check opens all sites: a change to one site's pages runs it, and so does a change to a
  # site's settings under packages/site-check.
  # The package's tests run in the same job and include a browser test of the homepage (nav-menus::US-004/AC-03), which
  # builds apps/home itself.
  # The browser is Playwright's headless shell, downloaded on every run: there is no cache yet, so read this step's
  # time in a run before adding one.
  width-check:
    name: Site width check
    needs: changes
    if: needs.changes.outputs.home == 'true' || needs.changes.outputs.agentshed == 'true' || needs.changes.outputs.justsnap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must come before setup-node: setup-node's cache: 'pnpm' calls pnpm to find the store path
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aloong-planet/site-check exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @aloong-planet/site-check run test
      - run: pnpm --filter @aloong-planet/site-check run check

  # The one required check. `needs` must list every other job of this workflow. `always()` makes it run after a
  # failure or a skip upstream, which the default `success()` would not: a skipped required check counts as passing.
  ci-gate:
    name: CI gate
    needs: [changes, repo-policy, home-checks, agentshed-checks, justsnap-checks, site-kit-checks, width-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the selected jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/ci/ci-gate.mjs
