name: Deploy

# Deploys the homepage after CI succeeds on a push to main. A separate workflow so that CI's jobs stay the ones
# its gate requires, and deployment is never a check a pull request waits on.
# To redeploy a revision, re-run its Deploy run; it deploys only while that revision is still the tip of main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # `branches` matches a pull request from a fork whose branch is named main, so the event and the repository
    # are checked as well.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Configure CLOUDFLARE_API_TOKEN in repository Actions secrets. See docs/ops/deployment.md.'
            exit 1
          fi
      # GITHUB_SHA of a workflow_run is the tip of the default branch when this run started, not the revision CI
      # checked, so the comparison uses the checked revision.
      - name: Reject superseded revisions
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CHECKED_SHA"
      - name: Deploy existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm cf:deploy
