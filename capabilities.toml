client-framework = "none"
working-language = "en"

# i18n stays off: it is a repository-wide claim about the product interface, and apps/home has no dictionary. AGENTS.md
# holds apps/agentshed and apps/justsnap each to its own dictionary, and their tests check it.
[i18n]
enabled = false

# Every site this repository builds follows the system's light and dark appearance; source names each site's theme
# stylesheets, and AGENTS.md holds each to its light and dark tokens.
[theming]
enabled = true
source = ["apps/home/public/site.css", "apps/home/public/article.css", "apps/agentshed/src/styles/global.css", "apps/justsnap/src/styles/global.css"]
enforced-by = ["pnpm --filter @aloong-planet/home run test", "pnpm --filter @aloong-planet/site-check run test", "pnpm --filter @aloong-planet/agentshed run test", "pnpm --filter @aloong-planet/justsnap run test"]

[lint]
enabled = true
source = "apps/agentshed/eslint.config.js"
enforced-by = ["pnpm --filter @aloong-planet/agentshed run lint", "pnpm --filter @aloong-planet/agentshed run test:lint-rule"]

[e2e-suite]
enabled = true
source = ["packages/site-check/src/check-sites.mjs", "apps/agentshed/vitest.config.ts", "apps/justsnap/vitest.config.ts"]
enforced-by = ["pnpm --filter @aloong-planet/site-check run check", "pnpm --filter @aloong-planet/site-check run test", "pnpm --filter @aloong-planet/agentshed run test", "pnpm --filter @aloong-planet/justsnap run test"]

[mutation-testing]
enabled = false

[enumeration-wording-gate]
enabled = false

[docs-auto-merge]
enabled = true
source = "docs/ops/documentation-merges.md"
enforced-by = []
