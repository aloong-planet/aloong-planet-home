client-framework = "none"
working-language = "en"

[i18n]
enabled = false

[theming]
enabled = false

[lint]
enabled = false

[e2e-suite]
enabled = true
source = "packages/site-check/src/check-sites.mjs"
enforced-by = ["pnpm --filter @aloong-planet/site-check run check"]

[mutation-testing]
enabled = false

[enumeration-wording-gate]
enabled = false

[docs-auto-merge]
enabled = true
source = "docs/ops/documentation-merges.md"
enforced-by = []
