client-framework = "none"
working-language = "en"

# Each site that has pages of its own keeps its interface copy in a dictionary with a Chinese and an English version, and
# AGENTS.md holds both sites to theirs. The homepage dictionary's two languages are held to one shape by its typecheck.
[i18n]
enabled = true
source = ["apps/home/public/ui.js", "apps/agentshed/src/i18n/ui.ts"]
enforced-by = ["pnpm --filter @aloong-planet/home run typecheck", "pnpm --filter @aloong-planet/home run test", "pnpm --filter @aloong-planet/agentshed run check", "pnpm --filter @aloong-planet/agentshed run test"]

# Theming stays off: it is a repository-wide claim about the product interface, and apps/home has one appearance.
# AGENTS.md holds apps/agentshed to its light and dark tokens, and its tests check both.
[theming]
enabled = false

[lint]
enabled = true
source = "apps/agentshed/eslint.config.js"
enforced-by = ["pnpm --filter @aloong-planet/agentshed run lint", "pnpm --filter @aloong-planet/agentshed run test:lint-rule"]

[e2e-suite]
enabled = true
source = ["packages/site-check/src/check-sites.mjs", "apps/agentshed/vitest.config.ts"]
enforced-by = ["pnpm --filter @aloong-planet/site-check run check", "pnpm --filter @aloong-planet/site-check run test", "pnpm --filter @aloong-planet/agentshed run test"]

[mutation-testing]
enabled = false

[enumeration-wording-gate]
enabled = false

[docs-auto-merge]
enabled = true
source = "docs/ops/documentation-merges.md"
enforced-by = []
