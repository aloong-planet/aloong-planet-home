<!doctype html>
<!-- prototype-blog.md -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog 预览</title><script src="../manifest.js"></script><script src="../app-identity.js"></script><link rel="stylesheet" href="../_shared/site.css"></head><body><div class="ap-site"><div data-shared-block="nav"></div><main class="ap-blog"><div class="ap-blog-head"><h1>Blog</h1><p class="ap-blog-intro">关于技术、作品，以及创造的过程。把值得留下的想法，慢慢写下来。</p></div><div id="blogList" data-shared-block="blog-list"></div><p style="margin-top:50px"><a class="ap-link" href="../homepage/prototype-home.html" data-goto="homepage/home" data-goto-href="../homepage/prototype-home.html">返回首页</a></p></main></div><div data-demo-harness><span class="dh-tag">Demo ·</span><div class="dh-group"><span class="dh-title">Published posts</span><div class="dh-opts"><button type="button" class="dh-opt" data-count="1" aria-pressed="false">1</button><button type="button" class="dh-opt" data-count="2" aria-pressed="false">2</button><button type="button" class="dh-opt" data-count="7" aria-pressed="true">7</button></div></div><div class="dh-group"><span class="dh-title">Newest post</span><div class="dh-opts"><button type="button" class="dh-opt" data-lead="super-agent-architecture" aria-pressed="true">Short title</button><button type="button" class="dh-opt" data-lead="claude-code-idle-compaction" aria-pressed="false">Long title</button></div></div><p class="dh-note">App: set by the published posts and their dates; this page lists all of them, newest first. No such controls.</p></div><script src="../demo-harness.js"></script><script src="../_shared/blog-posts.js"></script><script>const counts=[...document.querySelectorAll('[data-count]')],leads=[...document.querySelectorAll('[data-lead]')];let count=7,lead='super-agent-architecture';function show(){BlogMock.list(document.getElementById('blogList'),count,lead);counts.forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.count)===count)));leads.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lead===lead)));}counts.forEach(b=>b.addEventListener('click',()=>{count=Number(b.dataset.count);show();}));leads.forEach(b=>b.addEventListener('click',()=>{lead=b.dataset.lead;show();}));show();</script><script src="../_shared/navigation.js"></script><script>document.addEventListener('click',e=>{const el=e.target.closest('[data-goto]');if(!el)return;e.preventDefault();if(window.parent!==window)parent.postMessage({type:'proto-nav',target:el.dataset.goto},'*');else location.href=el.dataset.gotoHref;});</script></body></html>
