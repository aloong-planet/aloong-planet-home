<style>

.ap-notfound{min-height:calc(100svh - 76px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px 76px}

</style></head><body><div class="ap-site"><div data-shared-block="nav"></div><main class="ap-notfound"><img class="ap-notfound-dog" src="../../../assets/not-found/puzzled-dog.webp" width="160" height="160" alt="歪着头找东西的金毛小狗"><p class="ap-notfound-code">404</p><h1>这一页走丢了</h1><p class="ap-notfound-text">小狗找了一圈，没找到这个地址。<br>可能是链接打错了，或者页面已经搬走。</p><div class="ap-notfound-actions"><a class="ap-button ap-button-primary" href="../homepage/prototype-home.html" data-goto="homepage/home" data-goto-href="../homepage/prototype-home.html">回首页</a><a class="ap-button ap-button-secondary" href="../blog/prototype-blog.html" data-goto="blog/blog" data-goto-href="../blog/prototype-blog.html">看看博客</a></div></main></div><script src="../_shared/navigation.js"></script><script>document.addEventListener('click',e=>{const el=e.target.closest('[data-goto]');if(!el)return;e.preventDefault();if(window.parent!==window)parent.postMessage({type:'proto-nav',target:el.dataset.goto},'*');else location.href=el.dataset.gotoHref;});</script></body></html>
