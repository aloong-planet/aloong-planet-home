<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aloong 的个人星球：分享独立作品，记录技术、创造和生活。">
  <title>Aloong Planet</title>
  <link rel="stylesheet" href="/site.css">
  <link rel="canonical" href="https://aloongplanet.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/navigation.js" defer></script>
  <script src="/assets/golden-interaction.js" defer></script>
  <script type="module" src="/visitor.js"></script>
</head>
<body class="ap-site">
  <div data-site-navigation></div>
  <main>
    <section class="ap-hero" aria-labelledby="homeTitle">
      <div class="ap-hero-profile">
        <div class="ap-scene">
          <div class="ap-floor" aria-hidden="true"></div>
          <img class="ap-person" src="/assets/aloong-cartoon.webp" width="260" height="390" fetchpriority="high" alt="Aloong 穿蓝色 T 恤坐在木凳上的卡通形象">
          <button class="golden-trigger" id="goldenTrigger" type="button" aria-label="小狗摇尾巴" aria-pressed="true">
            <span class="golden-mascot" id="goldenMascot" data-drawing="false">
              <img class="golden-idle" id="goldenIdle" src="/assets/golden-wag/idle.png" width="160" height="160" fetchpriority="low" alt="坐在 Aloong 身旁的金毛">
              <canvas class="golden-canvas" id="goldenCanvas" width="320" height="320" aria-hidden="true" data-mode="loading"></canvas>
            </span>
          </button>
        </div>
        <div class="ap-intro">
          <h1 id="homeTitle">Hi, I'm Aloong.</h1>
          <p>把好奇心变成作品，<br>记录技术、创造和生活里的小发现。</p>
          <p class="ap-visitor" data-visitor-counter aria-live="polite" aria-atomic="true"></p>
        </div>
        <span id="goldenStatus" hidden></span>
      </div>
      <!-- blog:home -->
    </section>
    <section class="ap-work" id="apps" aria-labelledby="appsTitle">
      <h2 class="ap-section-title" id="appsTitle">Apps.</h2>
      <div class="ap-grid">
        <article class="ap-project">
          <a class="ap-art" href="https://transfer.aloongplanet.com/" target="_blank" rel="noreferrer" aria-label="查看 Transfer 官网">
            <img src="/assets/apps/transfer-main-light.jpg" width="1100" height="720" alt="Transfer 白色主题主界面：演示设备、聊天记录与文件传输" loading="lazy">
          </a>
          <div class="ap-project-info"><h3>Transfer</h3><p>在局域网中传文件、发文字，<br>让电脑之间的分享像聊天一样简单。</p><a class="ap-link ap-project-visit" href="https://transfer.aloongplanet.com/" target="_blank" rel="noreferrer">访问 Transfer 官网</a></div>
        </article>
        <article class="ap-project">
          <a class="ap-art" href="https://agentshed.aloongplanet.com/" target="_blank" rel="noreferrer" aria-label="查看 Agentshed 官网">
            <img src="/assets/apps/agentshed-main-90days.png" width="2200" height="1440" alt="Agentshed 主界面：Agents 总览与近 90 天 Token 用量趋势" loading="lazy">
          </a>
          <div class="ap-project-info"><h3>Agentshed</h3><p>一处管理 coding agent 的项目、skills 与 MCP，<br>看清 Token 用量，回顾开发会话。</p><a class="ap-link ap-project-visit" href="https://agentshed.aloongplanet.com/" target="_blank" rel="noreferrer">访问 Agentshed 官网</a></div>
        </article>
      </div>
    </section>
  </main>
  <footer class="ap-footer" id="about">
    <h2>保持好奇，做点有意思的东西。</h2>
    <p>这里是 Aloong 的个人星球。<br>分享我做的作品，也记录一路上的想法。</p>
    <div class="ap-bottom"><span>aloong planet</span><span>作品 · 记录 · 日常</span></div>
  </footer>
</body>
</html>
